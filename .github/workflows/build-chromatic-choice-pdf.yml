name: Build chromatic-choice paper PDF

on:
  push:
    paths:
      - "drafts/chromatic-choice-random-graphs-20261022/asymptotic_equality_chromatic_choice_random_graphs.tex"
      - ".github/workflows/build-chromatic-choice-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Compile manuscript twice
        uses: xu-cheng/texlive-action@v2
        with:
          run: |
            cd drafts/chromatic-choice-random-graphs-20261022
            pdflatex -interaction=nonstopmode -halt-on-error asymptotic_equality_chromatic_choice_random_graphs.tex
            pdflatex -interaction=nonstopmode -halt-on-error asymptotic_equality_chromatic_choice_random_graphs.tex
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/chromatic-choice-random-graphs-20261022/asymptotic_equality_chromatic_choice_random_graphs.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build PDF for chromatic-choice random graph draft"
            git push
          fi
